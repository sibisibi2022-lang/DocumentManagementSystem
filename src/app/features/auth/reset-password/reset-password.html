
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800">DocuVault</h1>
    <p class="text-center text-gray-500 mt-2">Create a new password</p>

    <form class="mt-8" (ngSubmit)="resetPassword()">
      <div class="mb-4">
        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
          New password
        </label>
        <input
          id="newPassword"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          required
          minlength="8"
          maxlength="72"
          autocomplete="new-password"
          placeholder="Enter your new password"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="mb-6">
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Confirm password
        </label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
          placeholder="Re-enter your new password"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading || !token"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50"
      >
        {{ loading ? 'Updating...' : 'Reset Password' }}
      </button>

      @if (message) {
      <p class="text-center mt-4 text-sm text-green-700">{{ message }}</p>
      }

      @if (error) {
      <p class="text-center mt-4 text-sm text-red-600">{{ error }}</p>
      }
    </form>

    <p class="text-center mt-6 text-sm text-gray-600">
      <a routerLink="/forgot-password" class="text-blue-600 font-medium hover:underline">
        Request a new reset link
      </a>
    </p>
  </div>
</div>
