
<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800">
      DocuVault
    </h1>

    <p class="text-center text-gray-500 mt-2">
      Document Management System
    </p>

    <form class="mt-8" (ngSubmit)="login()">
      <div class="mb-4">
        <label
          for="email"
          class="block text-sm font-medium text-gray-700 mb-2"
        >
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="mb-3">
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-2"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="text-right mb-5">
        <a
          routerLink="/forgot-password"
          class="text-sm text-blue-600 font-medium hover:underline"
        >
          Forgot Password?
        </a>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700"
      >
        Login
      </button>

      @if (message) {
      <p class="text-center mt-4 text-sm font-medium">
        {{ message }}
      </p>
      }
    </form>
  </div>
</div>
