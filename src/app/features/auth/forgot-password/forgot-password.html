
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-3xl font-bold text-center text-gray-800">DocuVault</h1>
    <p class="text-center text-gray-500 mt-2">Reset your password</p>

    <form class="mt-8" (ngSubmit)="requestReset()">
      <div class="mb-5">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Registered email
        </label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50"
      >
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      @if (message) {
      <p class="text-center mt-4 text-sm text-green-700">{{ message }}</p>
      }

      @if (error) {
      <p class="text-center mt-4 text-sm text-red-600">{{ error }}</p>
      }
    </form>

    <p class="text-center mt-6 text-sm text-gray-600">
      Remember your password?
      <a routerLink="/login" class="text-blue-600 font-medium hover:underline">Back to Login</a>
    </p>
  </div>
</div>
